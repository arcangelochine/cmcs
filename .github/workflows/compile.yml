name: Compile book

on:
  push:
  pull_request:

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Typst
        uses: typst-community/setup-typst@v4
        with:
          version: 0.15.1

      - name: Compile PDF
        run: typst compile src/main.typ src/main.pdf

      - name: Upload PDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: cmcs-book
          path: src/main.pdf
          if-no-files-found: error
