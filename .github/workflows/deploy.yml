name: Build and Deploy Typst

on:
  push:
    branches: ["main"]

concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Typst
        uses: typst-community/setup-typst@v4
        with:
          version: 0.15.1

      - name: Build PDF and HTML wrapper
        run: |
          mkdir -p output

          typst compile src/main.typ output/index.pdf

          cat > output/index.html << 'EOF'
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <title>Computational Models for Complex Systems</title>
            <style>
              html, body { margin: 0; height: 100%; }
              object { display: block; border: none; width: 100%; height: 100%; }
              .fallback {
                position: fixed;
                bottom: 10px;
                left: 10px;
                background: white;
                padding: 6px 10px;
                border-radius: 4px;
                box-shadow: 0 1px 4px rgba(0, 0, 0, 0.15);
              }
            </style>
          </head>
          <body>
            <object data="index.pdf" type="application/pdf">
              <p class="fallback">
                PDF preview is not supported in this browser.
                <a href="index.pdf">Download the book</a>.
              </p>
            </object>
            <p class="fallback">
              <a href="index.pdf">Download PDF</a>
            </p>
          </body>
          </html>
          EOF

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: output/

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
